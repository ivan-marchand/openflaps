<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split-Flap Setup</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 12px; }
    .card { padding: 16px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; }
    button { padding: 12px 14px; margin: 6px 6px 6px 0; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; }
    input[type=text], input[type=password] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; }
    .status { margin-top: 10px; color: #333; }
    a.back { display: inline-block; margin-bottom: 16px; color: #0066cc; text-decoration: none; }
    form { display: block; }
  </style>
</head>
<body>
  <a class="back" href="/">← Back</a>
  <h2>Setup</h2>

  <div class="card">
    <h3 style="margin-top:0;">WiFi</h3>
    <form action="/setup" method="post">
      <input type="hidden" name="action" value="wifi" />
      <input name="ssid" type="text" placeholder="WiFi SSID" />
      <input name="password" type="password" placeholder="WiFi Password" style="margin-top:8px;" />
      <div style="margin-top:10px;">
        <button type="submit">Update WiFi &amp; Reboot</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Claude API Key</h3>
    <form action="/setup" method="post">
      <input type="hidden" name="action" value="apikey" />
      <input name="key" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <div style="margin-top:10px;">
        <button type="submit">Save API Key</button>
      </div>
    </form>
  </div>

  <div class="status">{{status}}</div>
</body>
</html>
