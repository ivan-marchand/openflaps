<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split-Flap Control</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 12px; }
    .card { padding: 16px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; }
    button { padding: 12px 14px; margin: 6px 6px 6px 0; border-radius: 10px; border: 1px solid #ccc; cursor: pointer; }
    input[type=text], input[type=password] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; }
    .status { margin-top: 10px; color: #333; }
    .small { color: #666; font-size: 0.9em; }
    .pill { display:inline-block; padding:4px 10px; border:1px solid #ccc; border-radius:999px; }
    form { display: inline; }
  </style>
</head>
<body>
  <h2>Split-Flap Controller</h2>
  <div class="card">
    <div class="small">Mode: <span class="pill">{{mode}}</span></div>

    <form action="/" method="post" style="display:block; margin-top:12px;">
      <input type="hidden" name="action" value="text" />
      <label>Text to display</label>
      <input name="t" type="text" placeholder="HEY!" maxlength="4" value="{{last_text}}" />
      <div style="margin-top:10px;">
        <button type="submit">Send Text</button>
      </div>
    </form>

    <form action="/" method="post" style="display:block; margin-top:14px;">
      <input type="hidden" name="action" value="claude" />
      <label>Ask Claude</label>
      <input name="prompt" type="text" placeholder="Are you smart?" />
      <div style="margin-top:10px;">
        <button type="submit">Ask</button>
      </div>
    </form>

    <div style="margin-top:14px;">
      <form action="/" method="post">
        <input type="hidden" name="action" value="mode" />
        <input type="hidden" name="m" value="time" />
        <button type="submit">Display Time</button>
      </form>
      <form action="/" method="post">
        <input type="hidden" name="action" value="mode" />
        <input type="hidden" name="m" value="temp" />
        <button type="submit">Display Temperature</button>
      </form>
      <form action="/" method="post">
        <input type="hidden" name="action" value="8ball" />
        <button type="submit">8-Ball</button>
      </form>
      <form action="/" method="post">
        <input type="hidden" name="action" value="home" />
        <button type="submit">Erase Screen</button>
      </form>
    </div>

    <div class="status">{{status}}</div>
  </div>

  <div style="margin-top: 8px;">
    <a href="/setup"><button type="button">Setup</button></a>
  </div>
</body>
</html>
