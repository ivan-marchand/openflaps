; firmware/attiny84/test-host/platformio.ini
; Host-compiled unit tests for the ATtiny84 split-flap logic.
; Does NOT touch the Arduino IDE build of ../split_flap_display_async.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I../split_flap_display_async
    ; ArduinoFake 0.4.0 bundles an old FakeIt; Apple clang 21 turns its
    ; `x.template Assign(...)` (no arg list) into a hard error. Downgrade it.
    -Wno-missing-template-arg-list-after-template-kw
    ; Same cause: FakeIt's `operator "" _Times` literal-operator spelling.
    -Wno-deprecated-literal-operator
lib_deps = fabiobatsilva/ArduinoFake@^0.4.0
lib_compat_mode = off
debug_test = native
